name: Publish Weavien homepage

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/sponsor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p website/sponsor
          cp docs/sponsor/wechat.png website/sponsor/wechat.png
          cp docs/sponsor/alipay.png website/sponsor/alipay.png
          cp favicon.ico website/favicon.ico
          printf 'window.WEAVIEN_CONFIG = { repository: "%s", branch: "%s" };\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > website/repository.js
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
